name: adaptive_nav_example
description: Demonstrates adaptive_nav — master-detail panes, draggable pane widths and exit guards.
publish_to: 'none'
version: 0.15.0

environment:
  sdk: ^3.10.8

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  adaptive_nav:
    path: ../
  # Feeds the shell iPhone Duo's geometry from UIKit; lib/duo_probe.dart draws
  # it as well. iOS builds of the example need Xcode 27.1 because of it.
  adaptive_nav_ios:
    path: ../../adaptive_nav_ios

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
