<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="adaptive_nav playground: one Flutter navigation state as a stack or master-detail panes on a desktop window, a phone, a tablet and foldables.">
  <title>adaptive_nav playground</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    html, body { margin: 0; height: 100%; background: #F2F2F7; }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px;
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #6B6B76;
    }
    #loading .spinner {
      width: 28px; height: 28px;
      border: 3px solid #DADAE3; border-top-color: #4F5B92;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>Loading adaptive_nav playground…</div>
  </div>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    _flutter.loader.load({
      onEntrypointLoaded: async function (engineInitializer) {
        const appRunner = await engineInitializer.initializeEngine();
        await appRunner.runApp();
        document.getElementById('loading')?.remove();
      },
    });
  </script>
</body>
</html>
