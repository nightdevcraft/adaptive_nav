<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="adaptive_nav playground: one Flutter navigation state as a stack or master-detail panes on a desktop window, a phone, a tablet and foldables.">
  <title>adaptive_nav playground</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    html, body { margin: 0; height: 100%; background: #F2F2F7; }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px;
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #6B6B76;
    }
    #loading .spinner {
      width: 28px; height: 28px;
      border: 3px solid #DADAE3; border-top-color: #4F5B92;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <!-- Yandex Metrika. The Pages workflow fills the counter in from the
       YANDEX_METRIKA_ID repository variable; left as is, nothing loads, so
       local runs and forks send nothing. The page is one canvas, so Webvisor
       and the click map would record nothing useful: what people do is sent
       as goals instead (see playgroundGoal). -->
  <script>
    (function () {
      var id = '__YANDEX_METRIKA_ID__';
      if (!/^\d+$/.test(id)) {
        window.playgroundGoal = function () {};
        return;
      }
      id = Number(id);
      (function (m, e, t, r, i, k, a) {
        m[i] = m[i] || function () { (m[i].a = m[i].a || []).push(arguments); };
        m[i].l = 1 * new Date();
        for (var j = 0; j < document.scripts.length; j++) {
          if (document.scripts[j].src === r) { return; }
        }
        k = e.createElement(t); a = e.getElementsByTagName(t)[0];
        k.async = 1; k.src = r; a.parentNode.insertBefore(k, a);
      })(window, document, 'script', 'https://mc.yandex.ru/metrika/tag.js?id=' + id, 'ym');
      ym(id, 'init', {
        referrer: document.referrer,
        url: location.href,
        clickmap: false,
        trackLinks: true,
        accurateTrackBounce: true,
        webvisor: false,
        trackHash: false
      });
      window.playgroundGoal = function (name) { ym(id, 'reachGoal', name); };
    })();
  </script>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>Loading adaptive_nav playground…</div>
  </div>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    _flutter.loader.load({
      onEntrypointLoaded: async function (engineInitializer) {
        const appRunner = await engineInitializer.initializeEngine();
        await appRunner.runApp();
        document.getElementById('loading')?.remove();
      },
    });
  </script>
</body>
</html>
