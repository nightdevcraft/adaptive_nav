name: adaptive_nav
description: >-
  A Navigator 2.0 router that renders one navigation state as a stack or as
  master-detail panes and keeps screen state across resizes and folds. Ready
  for iPhone Duo.
version: 0.12.0

repository: https://github.com/nightdevcraft/adaptive_nav
issue_tracker: https://github.com/nightdevcraft/adaptive_nav/issues

screenshots:
  # Quoted: a description may well contain a colon, and YAML would read that
  # as a mapping key.
  - description: 'iPhone Duo folded, unfolded and turned: the rail follows the system bar and the open screen keeps its state.'
    path: doc/screenshots/iphone-duo.gif

topics:
  - navigation
  - router
  - adaptive
  - master-detail
  - foldable

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
